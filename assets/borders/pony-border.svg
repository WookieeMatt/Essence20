<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="120"
   height="120"
   viewBox="0 0 120 120"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!--
    The Pony frame: a rounded rectangle, inset 1.5 with a corner radius of 14.5.

    Those two numbers are not free. This file is consumed as a 9-slice border-image and
    mask-border sliced at 16, so:

      * inset plus radius must equal the slice (1.5 + 14.5 = 16). Any more and the corner
        arc spills into the edge tiles; any less and it stops short of the tile's edge and
        the corner reads as clipped.
      * all four corners must share one radius, because the CSS clips the element with a
        single rounded inset. Four hand drawn radii cannot be matched by one clip, and
        wherever the art curved tighter than the clip, the clip cut the corner away.
      * the edges must be exactly straight. repeat:stretch takes the 88 unit edge strip and
        stretches it the whole length of the element, better than 7x on a sheet header, so
        any wobble in the drawing is magnified into a visibly bowed line.

    The clip radius that matches this art is the rendered border width itself: a rounded
    rect offset outward by d gains d of radius, and inset plus radius is the full slice, so
    at the element's own edge the radius equals the border width. See the accent and panel
    clip variables in sass/components/_theme_wrapper.scss.

    Keep XML comment rules in mind when editing this: a double hyphen is illegal inside an
    XML comment, so the CSS custom property names cannot be written out in full here. A
    malformed SVG does not fail loudly - border-image just falls back, and a mask-border
    that fails to load applies no mask at all, so the trim paints as a solid block.
  -->
  <g
     id="layer1">
    <path
       d="M 16,1.5 H 104 A 14.5,14.5 0 0 1 118.5,16 V 104 A 14.5,14.5 0 0 1 104,118.5 H 16 A 14.5,14.5 0 0 1 1.5,104 V 16 A 14.5,14.5 0 0 1 16,1.5 Z"
       style="fill:#fd0000;fill-opacity:0;stroke:#ff0000;stroke-width:1;stroke-dasharray:none;stroke-opacity:1"
       id="path4" />
  </g>
</svg>
